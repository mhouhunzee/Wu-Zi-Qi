<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋AI对弈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .win-probability {
            background: linear-gradient(90deg, #4CAF50, #FFC107, #F44336);
            height: 30px;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .win-probability-bar {
            height: 100%;
            background: rgba(255,255,255,0.3);
            transition: width 0.5s ease;
        }
        
        .win-probability-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .board-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(19, 30px);
            grid-template-rows: repeat(19, 30px);
            gap: 0;
            background: #DEB887;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .cell {
            width: 30px;
            height: 30px;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .cell::before,
        .cell::after {
            content: '';
            position: absolute;
            background: #8B4513;
        }
        
        .cell::before {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
        }
        
        .cell::after {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
        }
        
        /* 边缘单元格的线条调整 */
        .cell[data-row="0"]::after { top: 50%; height: 50%; }
        .cell[data-row="18"]::after { height: 50%; }
        .cell[data-col="0"]::before { left: 50%; width: 50%; }
        .cell[data-col="18"]::before { width: 50%; }
        
        .cell[data-row="0"][data-col="0"]::before { left: 50%; width: 50%; }
        .cell[data-row="0"][data-col="0"]::after { top: 50%; height: 50%; }
        .cell[data-row="0"][data-col="18"]::before { width: 50%; }
        .cell[data-row="0"][data-col="18"]::after { top: 50%; height: 50%; }
        .cell[data-row="18"][data-col="0"]::before { left: 50%; width: 50%; }
        .cell[data-row="18"][data-col="0"]::after { height: 50%; }
        .cell[data-row="18"][data-col="18"]::before { width: 50%; }
        .cell[data-row="18"][data-col="18"]::after { height: 50%; }
        
        .stone {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            position: relative;
            z-index: 10;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .stone.black {
            background: radial-gradient(circle at 30% 30%, #666, #000);
        }
        
        .stone.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ddd);
        }
        
        .stone.last-move::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
        }
        
        .cell:hover .hover-stone {
            display: block;
        }
        
        .hover-stone {
            display: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            position: absolute;
            z-index: 5;
            opacity: 0.5;
        }
        
        .hover-stone.black {
            background: radial-gradient(circle at 30% 30%, #666, #000);
        }
        
        .hover-stone.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ddd);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
        }
        
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .color-choice {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .color-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        
        .color-btn:hover {
            transform: scale(1.1);
        }
        
        .color-btn.selected {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }
        
        .color-btn.black {
            background: radial-gradient(circle at 30% 30%, #666, #000);
            color: white;
        }
        
        .color-btn.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ddd);
            color: #333;
            border: 2px solid #ccc;
        }
        
        .status-message {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .status-message.player-turn {
            background: #d4edda;
            color: #155724;
        }
        
        .status-message.ai-turn {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-message.game-over {
            background: #f8d7da;
            color: #721c24;
        }
        
        .star-points {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            pointer-events: none;
        }
        
        .star-point {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #8B4513;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 五子棋AI对弈</h1>
        
        <div class="game-info">
            <div class="info-item">
                <div class="info-label">你的颜色</div>
                <div class="info-value" id="player-color">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">当前回合</div>
                <div class="info-value" id="current-turn">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">AI胜率评估</div>
                <div class="info-value" id="ai-win-rate">-</div>
            </div>
        </div>
        
        <div class="win-probability" id="win-prob-bar" style="display: none;">
            <div class="win-probability-bar" id="win-prob-fill"></div>
            <div class="win-probability-text" id="win-prob-text">AI胜率: 50%</div>
        </div>
        
        <div id="status-message" class="status-message" style="display: none;"></div>
        
        <div class="board-container">
            <div class="board" id="board">
                <!-- 星位标记 -->
                <div class="star-points">
                    <div class="star-point" style="top: 105px; left: 105px;"></div>
                    <div class="star-point" style="top: 105px; left: 285px;"></div>
                    <div class="star-point" style="top: 105px; left: 465px;"></div>
                    <div class="star-point" style="top: 285px; left: 105px;"></div>
                    <div class="star-point" style="top: 285px; left: 285px;"></div>
                    <div class="star-point" style="top: 285px; left: 465px;"></div>
                    <div class="star-point" style="top: 465px; left: 105px;"></div>
                    <div class="star-point" style="top: 465px; left: 285px;"></div>
                    <div class="star-point" style="top: 465px; left: 465px;"></div>
                </div>
                <!-- 棋盘格子将由JS生成 -->
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="start-btn" onclick="showStartModal()">开始游戏</button>
            <button class="btn btn-secondary" id="undo-btn" onclick="undoMove()" disabled>悔棋</button>
            <button class="btn btn-secondary" id="restart-btn" onclick="showStartModal()">重新开始</button>
        </div>
    </div>
    
    <!-- 开始游戏弹窗 -->
    <div class="modal" id="start-modal">
        <div class="modal-content">
            <h2>选择你的阵营</h2>
            <p>黑方先手，白方后手</p>
            <div class="color-choice">
                <div class="color-btn black" onclick="selectColor('black')">
                    <span>⚫</span>
                    <span>黑方</span>
                </div>
                <div class="color-btn white" onclick="selectColor('white')">
                    <span>⚪</span>
                    <span>白方</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="startGame()" id="confirm-start" disabled>确认开始</button>
        </div>
    </div>
    
    <!-- 游戏结束弹窗 -->
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2 id="game-result-title">游戏结束</h2>
            <p id="game-result-message"></p>
            <button class="btn btn-primary" onclick="closeGameOverModal()">再来一局</button>
        </div>
    </div>

    <script>
        let selectedColor = null;
        let gameState = null;
        let lastMove = null;
        const BOARD_SIZE = 19;
        
        // 初始化棋盘
        function initBoard() {
            const board = document.getElementById('board');
            // 清除现有的格子（保留星位标记）
            const cells = board.querySelectorAll('.cell');
            cells.forEach(cell => cell.remove());
            
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.onclick = () => makeMove(row, col);
                    
                    const hoverStone = document.createElement('div');
                    hoverStone.className = 'hover-stone';
                    cell.appendChild(hoverStone);
                    
                    board.appendChild(cell);
                }
            }
        }
        
        // 选择颜色
        function selectColor(color) {
            selectedColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            document.querySelector(`.color-btn.${color}`).classList.add('selected');
            document.getElementById('confirm-start').disabled = false;
        }
        
        // 显示开始弹窗
        function showStartModal() {
            document.getElementById('start-modal').classList.add('active');
        }
        
        // 开始游戏
        async function startGame() {
            if (!selectedColor) return;
            
            document.getElementById('start-modal').classList.remove('active');
            
            try {
                console.log('开始游戏，选择颜色:', selectedColor);
                
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_color: selectedColor })
                });
                
                console.log('响应状态:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('服务器错误:', errorText);
                    alert('服务器错误: ' + errorText);
                    return;
                }
                
                const data = await response.json();
                console.log('收到数据:', data);
                
                // 检查是否有错误
                if (data.error) {
                    console.error('后端错误:', data.error);
                    alert('错误: ' + data.error);
                    return;
                }
                
                gameState = data;
                
                // 如果AI先手，显示AI落子
                if (gameState.ai_move) {
                    lastMove = gameState.ai_move;
                    renderBoard();
                }
                
                updateUI();
            } catch (error) {
                console.error('开始游戏失败:', error);
                alert('开始游戏失败: ' + error.message);
            }
        }
        
        // 落子
        async function makeMove(row, col) {
            if (!gameState || gameState.game_over) return;
            
            // 确保数据类型正确
            const currentPlayer = Number(gameState.current_player);
            const playerColor = Number(gameState.player_color);
            
            if (currentPlayer !== playerColor) {
                updateStatus('ai-turn', 'AI思考中，请稍候...');
                return;
            }
            
            try {
                console.log('玩家落子前:', { current: currentPlayer, player: playerColor });
                
                const response = await fetch('/api/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ row, col })
                });
                
                const newState = await response.json();
                console.log('收到后端响应:', { 
                    current: newState.current_player, 
                    player: newState.player_color,
                    ai_move: newState.ai_move,
                    game_over: newState.game_over
                });
                
                gameState = newState;
                lastMove = gameState.player_move;
                renderBoard();
                updateUI();
                
                if (gameState.game_over) {
                    showGameOver();
                }
            } catch (error) {
                console.error('落子失败:', error);
            }
        }
        
        // 悔棋
        async function undoMove() {
            if (!gameState || gameState.game_over) return;
            
            try {
                const response = await fetch('/api/undo', { method: 'POST' });
                gameState = await response.json();
                lastMove = null;
                renderBoard();
                updateUI();
            } catch (error) {
                console.error('悔棋失败:', error);
            }
        }
        
        // 渲染棋盘
        function renderBoard() {
            if (!gameState) return;
            
            const board = gameState.board;
            const cells = document.querySelectorAll('.cell');
            
            cells.forEach(cell => {
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);
                const value = board[row][col];
                
                // 清除现有棋子
                const existingStone = cell.querySelector('.stone');
                if (existingStone) {
                    existingStone.remove();
                }
                
                // 添加新棋子
                if (value !== 0) {
                    const stone = document.createElement('div');
                    stone.className = `stone ${value === 1 ? 'black' : 'white'}`;
                    if (lastMove && lastMove[0] === row && lastMove[1] === col) {
                        stone.classList.add('last-move');
                    }
                    cell.appendChild(stone);
                }
                
                // 更新悬停效果
                const hoverStone = cell.querySelector('.hover-stone');
                const currentPlayerNum = Number(gameState.current_player);
                const playerColorNum = Number(gameState.player_color);
                if (gameState && !gameState.game_over && currentPlayerNum === playerColorNum) {
                    hoverStone.className = `hover-stone ${playerColorNum === 1 ? 'black' : 'white'}`;
                }
            });
        }
        
        // 更新UI
        function updateUI() {
            if (!gameState) return;
            
            // 确保数据类型正确（转换为数字）
            const currentPlayer = Number(gameState.current_player);
            const playerColor = Number(gameState.player_color);
            const aiColor = Number(gameState.ai_color);
            
            // 调试信息
            console.log('updateUI:', {
                current_player: currentPlayer,
                player_color: playerColor,
                ai_color: aiColor,
                game_over: gameState.game_over,
                types: {
                    current: typeof currentPlayer,
                    player: typeof playerColor
                }
            });
            
            // 玩家颜色
            const playerColorText = playerColor === 1 ? '⚫ 黑方' : '⚪ 白方';
            document.getElementById('player-color').textContent = playerColorText;
            
            // 当前回合
            const currentTurnText = currentPlayer === 1 ? '⚫ 黑方回合' : '⚪ 白方回合';
            document.getElementById('current-turn').textContent = currentTurnText;
            
            // AI胜率
            const aiWinRate = gameState.ai_win_probability || 0.5;
            document.getElementById('ai-win-rate').textContent = `${(aiWinRate * 100).toFixed(1)}%`;
            
            // 胜率条
            const winProbBar = document.getElementById('win-prob-bar');
            const winProbFill = document.getElementById('win-prob-fill');
            const winProbText = document.getElementById('win-prob-text');
            
            winProbBar.style.display = 'block';
            winProbFill.style.width = `${aiWinRate * 100}%`;
            winProbText.textContent = `AI胜率: ${(aiWinRate * 100).toFixed(1)}%`;
            
            // 状态消息
            console.log(`判断: ${currentPlayer} === ${playerColor} ? ${currentPlayer === playerColor}`);
            if (gameState.game_over) {
                updateStatus('game-over', '游戏结束');
            } else if (currentPlayer === playerColor) {
                updateStatus('player-turn', '轮到你了！点击棋盘落子');
            } else {
                updateStatus('ai-turn', 'AI思考中...');
            }
            
            // 按钮状态
            document.getElementById('undo-btn').disabled = gameState.game_over;
        }
        
        // 更新状态消息
        function updateStatus(type, message) {
            const statusEl = document.getElementById('status-message');
            statusEl.className = `status-message ${type}`;
            statusEl.textContent = message;
            statusEl.style.display = 'block';
        }
        
        // 显示游戏结束
        function showGameOver() {
            const winner = gameState.winner;
            const playerWon = winner === gameState.player_color;
            const isDraw = winner === null;
            
            const title = document.getElementById('game-result-title');
            const message = document.getElementById('game-result-message');
            
            if (isDraw) {
                title.textContent = '🤝 平局！';
                message.textContent = '势均力敌，难分胜负！';
            } else if (playerWon) {
                title.textContent = '🎉 恭喜你赢了！';
                message.textContent = '你击败了AI！';
            } else {
                title.textContent = '😔 AI获胜！';
                message.textContent = '再接再厉！';
            }
            
            document.getElementById('game-over-modal').classList.add('active');
        }
        
        // 关闭游戏结束弹窗
        function closeGameOverModal() {
            document.getElementById('game-over-modal').classList.remove('active');
            showStartModal();
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initBoard();
            showStartModal();
        });
    </script>
</body>
</html>
